name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        uses: jdx/mise-action@v2

      - name: Generate project
        run: TUIST_SKIP_UPDATE_CHECK=1 tuist generate --no-open

      - name: Run unit tests
        run: |
          TUIST_SKIP_UPDATE_CHECK=1 tuist xcodebuild test \
            -scheme Viska \
            -configuration Debug \
            -derivedDataPath "$PWD/.build/DerivedData-tests"
